[tool.pytest.ini_options]
# Puts the repo root on sys.path so `from src.contracts import ...` resolves
# without needing `pip install -e .`. One line here beats a packaging setup we
# do not otherwise need.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors. I: import sorting. UP: modern syntax.
# B: bugbear (real bug patterns, e.g. mutable default arguments).
select = ["E", "F", "I", "UP", "B"]
